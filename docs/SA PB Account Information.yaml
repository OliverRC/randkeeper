        - Beneficiaries and Beneficiary payments
      operationId: payBeneficiary
      security:
        - OAuth2:
            - beneficiarypayments
        - OAuth2Sandbox:
            - beneficiarypayments
      parameters:
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
          example: application/json
        - in: path
          name: accountId
          required: true
          schema:
            type: string
          example: "3353431574710163189587446"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                paymentList:
                  type: array
                  items:
                    required:
                      - beneficiaryId
                      - amount
                      - myReference
                      - theirReference
                    type: object
                    additionalProperties: false
                    properties:
                      beneficiaryId:
                        type: string
                      amount:
                        type: string
                      myReference:
                        type: string
                      theirReference:
                        type: string
                      authoriserAId:
                        description: If the payment requires authorisation this is derived from
                          profiles/{profileId}/accounts/{accountId}/authorisationsetupdetails.
                        type: string
                      authoriserBId:
                        description: If the payment requires authorisation this is derived from
                          profiles/{profileId}/accounts/{accountId}/authorisationsetupdetails.
                        type: string
                      authPeriodId:
                        description: If the payment requires authorisation this is derived from
                          profiles/{profileId}/accounts/{accountId}/authorisationsetupdetails.
                        type: string
                      fasterPayment:
                        description: If the payment requires authorisation this can be set to true if
                          the beneficiary allows it from
