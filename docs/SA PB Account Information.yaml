  termsOfService: https://developer.investec.com/za/terms-of-use
  contact:
    name: Investec Developer Support
    email: developer@investec.com
tags:
  - name: Account information
    description: Get account-related data, including current balances, transaction
      history, pending transactions, and associated beneficiaries.
  - name: Inter account transfers
    description: Transfer funds to one or multiple accounts.
  - name: Beneficiaries and Beneficiary payments
    description: Make a payment to one or more beneficiaries. This includes payments
      requiring authorisation.
  - name: Documents
    description: Get a list of documents and retrieve specified documents.
paths:
  /za/pb/v1/accounts:
    get:
      summary: Get Accounts
      description: Get a list of accounts along with associated metadata, including
        account name, account type, and linked Investec Online Banking profiles.
      operationId: accounts
      tags:
        - Account information
      security:
        - OAuth2:
            - accounts
        - OAuth2Sandbox:
            - accounts
      x-codeSamples:
        - lang: Curl
          label: cURL
          source: "curl --location
            'https://openapisandbox.investec.com/za/pb/v1/accounts'  --header
            'Authorization: Bearer {yourBearerToken}'"
        - lang: HTTP
          label: HTTP
          source: |-
            GET /za/pb/v1/accounts HTTP/1.1 
            Host: openapisandbox.investec.com 
            Authorization: Bearer {yourBearerToken}
      responses:
        "200":
          description: The requested operation was successfully completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccounts"
              example:
                data:
                  accounts:
                    - accountId: "3353431574710163189587446"
                      accountNumber: "10101010101"
                      accountName: Mr John Doe
                      referenceName: My Investec Private Bank Account
                      productName: Private Bank Account
                      kycCompliant: true
                      profileId: "10163189587443"
                      profileName: My Profile
                links:
                  self: https://openapi.investec.com/za/pb/v1/accounts
                meta:
                  totalPages: 1
        "400":
          description: Bad Request - The requested operation will not be carried out
        "401":
          description: Unauthorized - The requested operation was refused access
        "403":
          description: Forbidden - Not permitted to make this request
        "429":
          description: Too Many Requests - To many requests in quick succession, Retry the
            request.
        "500":
          description: Internal Server Error - The requested operation failed to execute
  /za/pb/v1/accounts/{accountId}/balance:
    get:
      summary: Get Account Balance
      description: Get the balance for a specified account.
      operationId: balance
      tags:
        - Account information
      security:
        - OAuth2:
            - balances
        - OAuth2Sandbox:
            - balances
      x-codeSamples:
        - lang: Curl
          label: cURL
          source: "curl --location
            'https://openapisandbox.investec.com/za/pb/v1/accounts/{accountId}/\
            balance'  --header 'Authorization: Bearer {yourBearerToken}'"
        - lang: HTTP
          label: HTTP
          source: |-
            GET /za/pb/v1/accounts/{accountId}/balance HTTP/1.1 
             Host: openapisandbox.investec.com 
            Authorization: Bearer {yourBearerToken}
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 30
      responses:
        "200":
          description: Resource has been retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAccountBalance"
              example:
                data:
                  accountId: "172878438321553632224"
                  currentBalance: 28857.76
                  availableBalance: 98857.76
                  budgetBalance: 0
                  straightBalance: 0
                  cashBalance: -10818415.98
                  currency: ZAR
                links:
                  self: https://openapi.investec.com/za/pb/v1/accounts/{accountId}/balance
                meta:
                  totalPages: 1
        "400":
          description: Bad Request - The requested operation will not be carried out
        "401":
          description: Unauthorized - The requested operation was refused access
        "403":
          description: Forbidden - Not permitted to make this request
        "429":
          description: Too Many Requests - To many requests in quick succession, Retry the
            request.
        "500":
          description: Internal Server Error - The requested operation failed to execute
  /za/pb/v1/accounts/{accountId}/transactions:
    get:
      summary: Get Account Transactions
      description: Get the transactions for a specified account.
      tags:
        - Account information
      operationId: accountsTransactions
      security:
        - OAuth2:
            - transactions
        - OAuth2Sandbox:
            - transactions
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 30
        - name: fromDate
          description: Refers to the date range filter's start date. Will default to
            today's date, minus 180 days, if not specified.
          in: query
          required: false
          style: form
          schema:
            type: string
            example: 2021-05-01
        - name: toDate
          description: Refers to the date range filter's end date. Will default to today's
            date if not specified.
          in: query
          required: false
          style: form
          schema:
            type: string
            example: 2021-06-01
        - name: transactionType
          description: Refers to the transaction type filter's value.
          in: query
          required: false
          style: form
          schema:
            type: string
            example: FeesAndInterest
        - in: query
          name: includePending
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Resource has been retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetTransactions"
              example:
                data:
                  transactions:
                    - accountId: "172878438321553632224"
                      type: DEBIT
                      transactionType: FeesAndInterest
                      status: POSTED
                      description: MONTHLY SERVICE CHARGE
                      cardNumber: ""
                      postedOrder: 13379
                      postingDate: 2020-06-11
                      valueDate: 2020-06-10
                      actionDate: 2020-11-10
                      transactionDate: 2020-06-10
                      amount: 535
                      runningBalance: 28857.76
                      uuid: "32224202006110013379"
                    - accountId: "172878438321553632224"
                      type: CREDIT
                      transactionType: FeesAndInterest
                      status: POSTED
                      description: CREDIT INTEREST
                      cardNumber: ""
                      postedOrder: 13378
                      postingDate: 2020-06-11
                      valueDate: 2020-06-10
                      actionDate: 2020-11-10
                      transactionDate: 2020-06-10
                      amount: 31.09
                      runningBalance: 29392.76
                      uuid: "32224202006110013378"
                links:
                  self: https://openapi.investec.com/za/pb/v1/accounts/{accountId}/transactions?fromDate={fromDate}&toDate={toDate}&transactionType={transactionType}
                meta:
                  totalPages: 1
        "400":
          description: Bad Request - The requested operation will not be carried out
        "401":
          description: Unauthorized - The requested operation was refused access
        "403":
          description: Forbidden - Not permitted to make this request
        "429":
          description: Too Many Requests - To many requests in quick succession, Retry the
            request.
        "500":
          description: Internal Server Error - The requested operation failed to execute
  /za/pb/v1/accounts/{accountId}/pending-transactions:
    get:
      summary: Get Account Pending Transactions
      description: Get the pending transactions for a specified account.
      tags:
        - Account information
      operationId: accountsPendingTransactions
      security:
        - OAuth2:
            - transactions
        - OAuth2Sandbox:
            - transactions
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 30
      responses:
        "200":
          description: Resource has been retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPendingTransactions"
              example:
                data:
                  transactions:
                    - accountId: "172878438321553632224"
                      type: DEBIT
                      status: PENDING
                      description: MONTHLY SERVICE CHARGE
                      transactionDate: 2020-06-10
                      amount: 535
                links:
                  self: https://openapi.investec.com/za/pb/v1/accounts/{accountId}/pending-transactions
                meta:
                  totalPages: 1
        "400":
          description: Bad Request - The requested operation will not be carried out
        "401":
          description: Unauthorized - The requested operation was refused access
        "403":
          description: Forbidden - Not permitted to make this request
        "429":
          description: Too Many Requests - To many requests in quick succession, Retry the
            request.
        "500":
          description: Internal Server Error - The requested operation failed to execute
  /za/pb/v1/accounts/{accountId}/transfermultiple:
    post:
      summary: Transfer Multiple
      description: Transfer funds to one or multiple accounts.
      tags:
        - Inter account transfers
      operationId: transferv2
      security:
        - OAuth2:
            - transfers
        - OAuth2Sandbox:
            - transfers
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
        - in: header
          name: Content-Type
          required: true
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                transferList:
                  type: array
                  items:
                    required:
                      - beneficiaryAccountId
                      - amount
                      - myReference
                      - theirReference
                    type: object
                    additionalProperties: false
                    properties:
                      beneficiaryAccountId:
                        type: string
                      amount:
                        type: string
                      myReference:
                        type: string
                      theirReference:
                        type: string
                profileId:
                  type: string
            example:
              transferList:
                - beneficiaryAccountId: XXXXXXXXXX
                  amount: "10.12"
                  myReference: Trans from PBA to PS
                  theirReference: Trans from PBA to PS
              profileId: "10163189587443"
      responses:
        "200":
          description: Resource has been retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer2"
              example:
                data:
                  TransferResponses:
                    - PaymentReferenceNumber: UBP0012345678
                      PaymentDate: 06/04/2022
                      Status: "- No authorisation necessary <BR>- Payment/Transfer effective date
                        06/04/2022"
                      BeneficiaryName: API transfer
                      BeneficiaryAccountId: XXXXXXXXXX
                      AuthorisationRequired: false
                  ErrorMessage: null
                links:
                  self: https://openapi.investec.com/za/pb/v1/accounts/172878438321553632224/transfermultiple
                meta:
                  totalPages: 1
        "400":
          description: Bad Request - The requested operation will not be carried out
        "401":
          description: Unauthorized - The requested operation was refused access
        "403":
          description: Forbidden - Not permitted to make this request
        "429":
          description: Too Many Requests - To many requests in quick succession, Retry the
            request.
        "500":
          description: Internal Server Error - The requested operation failed to execute
